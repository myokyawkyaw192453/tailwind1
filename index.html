<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-red-500">
    <div class="flex">
        <div class="bg-skyblue-500px w-[50%] h-[100vh] justify-center flex item-center">
            <img src="image.png" alt="logo">
        </div>
        <div class="bg-green-500 w-[50%] h-[100vh] justify-center item-center shadow-lg">
            <h1 class="text-3xl font-blod text-center flex-col ">login Form
            </h1>   
            <label class="bolck font-semibold mb-2">Email</label>
            <input type="Email" placeholder="Enter your email"
            class=" w-full border rounded-lg mb-4 p-3">

            <label class="bolck font-semibold mb-2">Password</label>    
            <input type="password"
            placeholder="Enter your password"
            class="w-full border rounded-lg mb-5 p-3">  
            <button class="bg-blue-500 text-gold p-3 rounded-lg hover:bg-red-700 hover:bg-white-400 w-full">Login

            </button> 
            <p class="text-center mt-4">
                Don't have an account?
                <a href="#" class="text-purple-500"> Sign Up</a>
            </p>    
    </div>
    
    
</body>
</html>
